name: Build MPC Wavetable Splitter

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }

          python -m pip install pyinstaller

      - name: Verify main file
        shell: pwsh
        run: |
          if (-not (Test-Path "mpc_wavetable_splitter.py")) {
            Write-Error "mpc_wavetable_splitter.py was not found in the repository root."
            exit 1
          }

      - name: Build Windows application
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name "MPC Wavetable Splitter" `
            mpc_wavetable_splitter.py

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\MPC Wavetable Splitter\*" `
            -DestinationPath "MPC-Wavetable-Splitter-Windows-x64.zip" `
            -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MPC-Wavetable-Splitter-Windows-x64
          path: MPC-Wavetable-Splitter-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  build-macos-apple-silicon:
    name: macOS Apple Silicon
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f "requirements.txt" ]; then
            python -m pip install -r requirements.txt
          fi

          python -m pip install pyinstaller

      - name: Verify main file
        shell: bash
        run: |
          if [ ! -f "mpc_wavetable_splitter.py" ]; then
            echo "mpc_wavetable_splitter.py was not found in the repository root."
            exit 1
          fi

      - name: Build macOS application
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --name "MPC Wavetable Splitter" \
            mpc_wavetable_splitter.py

      - name: Create macOS ZIP
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/MPC Wavetable Splitter.app" \
            "MPC-Wavetable-Splitter-macOS-Apple-Silicon.zip"

      - name: Upload Apple Silicon build
        uses: actions/upload-artifact@v4
        with:
          name: MPC-Wavetable-Splitter-macOS-Apple-Silicon
          path: MPC-Wavetable-Splitter-macOS-Apple-Silicon.zip
          if-no-files-found: error
          retention-days: 30

  build-macos-intel:
    name: macOS Intel
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f "requirements.txt" ]; then
            python -m pip install -r requirements.txt
          fi

          python -m pip install pyinstaller

      - name: Verify main file
        shell: bash
        run: |
          if [ ! -f "mpc_wavetable_splitter.py" ]; then
            echo "mpc_wavetable_splitter.py was not found in the repository root."
            exit 1
          fi

      - name: Build macOS application
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --name "MPC Wavetable Splitter" \
            mpc_wavetable_splitter.py

      - name: Create macOS ZIP
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/MPC Wavetable Splitter.app" \
            "MPC-Wavetable-Splitter-macOS-Intel.zip"

      - name: Upload Intel build
        uses: actions/upload-artifact@v4
        with:
          name: MPC-Wavetable-Splitter-macOS-Intel
          path: MPC-Wavetable-Splitter-macOS-Intel.zip
          if-no-files-found: error
          retention-days: 30