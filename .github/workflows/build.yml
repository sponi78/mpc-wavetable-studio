name: Build MPC Wavetable Studio

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pyinstaller

      - name: Build Windows
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --name "MPC Wavetable Studio" \
            mpc_wavetable_splitter.py

      - uses: actions/upload-artifact@v4
        with:
          name: MPC-Wavetable-Studio-Windows
          path: dist/MPC\ Wavetable\ Studio/

  build-macos:
    strategy:
      matrix:
        runner:
          - macos-15
          - macos-15-intel

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pyinstaller

      - name: Build macOS
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --name "MPC Wavetable Studio" \
            mpc_wavetable_splitter.py

      - name: Zip macOS App
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/MPC Wavetable Studio.app" \
            "MPC-Wavetable-Studio-${{ matrix.runner }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: MPC-Wavetable-Studio-${{ matrix.runner }}
          path: MPC-Wavetable-Studio-${{ matrix.runner }}.zip