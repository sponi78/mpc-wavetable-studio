name: Build MPC Wavetable Splitter

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if exist requirements.txt (
            pip install -r requirements.txt
          )
          pip install pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller ^
            --noconfirm ^
            --clean ^
            --windowed ^
            --onedir ^
            --name "MPC Wavetable Splitter" ^
            mpc_wavetable_splitter.py
        shell: cmd

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: MPC-Wavetable-Splitter-Windows
          path: dist/MPC Wavetable Splitter/

  build-macos:
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pyinstaller

      - name: Build macOS App
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --name "MPC Wavetable Splitter" \
            mpc_wavetable_splitter.py

      - name: Create ZIP
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/MPC Wavetable Splitter.app" \
            "MPC-Wavetable-Splitter-${{ matrix.os }}.zip"

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: MPC-Wavetable-Splitter-${{ matrix.os }}
          path: MPC-Wavetable-Splitter-${{ matrix.os }}.zip